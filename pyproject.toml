[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplan-ai"
version = "0.1.0"
description = "Applied AI / Computer Vision system converting consumer iPhone captures into dimensioned floor plans with honest measurement confidence."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Cosmo AI Engineering Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "scipy>=1.11.0",
    "shapely>=2.0.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
viz = [
    "open3d>=0.18.0",
    "matplotlib>=3.8.0",
]
photo = [
    "open3d>=0.18.0",
    "pycolmap>=3.10.0",
    "torch>=2.2.0",
    "transformers>=4.39.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
